<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>BetNG Admin</title>
    <meta name="description" content="BetNG control plane. A portfolio simulation: no real money." />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        var t = localStorage.getItem("betng.theme");
        if (!localStorage.getItem("betng.admin.themed")) {
          localStorage.setItem("betng.admin.themed", "1");
          if (!t) localStorage.setItem("betng.theme", (t = "dark"));
        }
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
