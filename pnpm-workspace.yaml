packages:
  - "apps/gateway"
  - "apps/services/*"
  - "packages/*"

# Dependencies allowed to run install scripts (pnpm 10).
onlyBuiltDependencies:
  - "esbuild"

# The same list in the form pnpm 11 reads.
allowBuilds:
  '@prisma/engines': set this to true or false
  "esbuild": true
  prisma: set this to true or false

minimumReleaseAgeExclude:
  - '@zudojs/config@1.2.0'
  - '@zudojs/constants@1.1.1'
  - '@zudojs/container@1.1.2'
  - '@zudojs/core@1.2.1'
  - '@zudojs/crypto@1.3.0'
  - '@zudojs/database@1.2.1'
  - '@zudojs/errors@1.1.0 || 1.2.0'
  - '@zudojs/events@1.2.0'
  - '@zudojs/http@1.3.0'
  - '@zudojs/logger@1.3.0'
  - '@zudojs/middleware@1.0.3'
  - '@zudojs/observability@1.1.1'
  - '@zudojs/runtime@1.2.1'
  - '@zudojs/security@1.2.0'
  - '@zudojs/types@1.1.1'
  - '@zudojs/validation@1.0.3'
  - tsx@4.23.15
  - '@zudojs/cqrs@1.1.1'
  - '@zudojs/rpc@1.3.0'
  - '@zudojs/schema@1.1.1'
  - '@zudojs/adapters@1.1.0 || 1.2.0'
