<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Realtime pipeline from the event service to the UI"><rect width="1280" height="520" rx="16" fill="#F5F3EE"/><rect x="36" y="44" width="214" height="76" rx="10" fill="#FDFCFA" stroke="#E3142E" stroke-width="1.5"/><rect x="36" y="54" width="3" height="56" rx="1.5" fill="#E3142E"/><text x="143" y="71.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">Event service</text><text x="143" y="90.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">WS /live</text><path d="M250 82 L282 82" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M282.0 82.0 L273.9 85.9 L273.9 78.1 Z" fill="#CBC5B8"/><rect x="282" y="44" width="214" height="76" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="389" y="71.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">Transport</text><text x="389" y="90.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">WebSocket | SSE</text><path d="M496 82 L528 82" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M528.0 82.0 L519.9 85.9 L519.9 78.1 Z" fill="#CBC5B8"/><rect x="528" y="44" width="214" height="76" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="635" y="71.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">ConnectionManager</text><text x="635" y="90.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">status · backoff · replace</text><path d="M742 82 L774 82" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M774.0 82.0 L765.9 85.9 L765.9 78.1 Z" fill="#CBC5B8"/><rect x="774" y="44" width="214" height="76" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="881" y="71.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">RealtimeClient</text><text x="881" y="90.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">frames · PING/PONG · auth</text><path d="M988 82 L1020 82" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M1020.0 82.0 L1011.9 85.9 L1011.9 78.1 Z" fill="#CBC5B8"/><rect x="1020" y="44" width="214" height="76" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="1127" y="71.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">EventRouter</text><text x="1127" y="90.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">dedupe · order · gaps</text><rect x="1020" y="200" width="214" height="76" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="1127" y="227.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">SubscriptionManager</text><text x="1127" y="246.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">reference-counted channels</text><path d="M1127 200 L1127 120" fill="none" stroke="#CBC5B8" stroke-width="1.6" stroke-dasharray="5 5"/><path d="M1127.0 120.0 L1130.9 128.1 L1123.1 128.1 Z" fill="#CBC5B8"/><rect x="282" y="200" width="460" height="76" rx="10" fill="#FDFCFA" stroke="#2457F5" stroke-width="1.5"/><rect x="282" y="210" width="3" height="56" rx="1.5" fill="#2457F5"/><text x="512" y="227.5" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">Platform data source</text><text x="512" y="246.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">timeline events · lifecycle signals · connection state</text><path d="M1020 110 C900 150, 800 200, 742 214" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M742.0 214.0 L749.0 208.3 L750.8 215.9 Z" fill="#CBC5B8"/><rect x="36" y="350" width="330" height="96" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="201" y="379" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">watchMatch</text><text x="201" y="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">appends timeline events in sequence</text><text x="201" y="415" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">re-reads on gap, signal, full time, reconnect</text><rect x="410" y="350" width="330" height="96" rx="10" fill="#FDFCFA" stroke="#E3DFD6" stroke-width="1"/><text x="575" y="379" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">Query invalidation</text><text x="575" y="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">odds, bets, wallet re-read</text><text x="575" y="415" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">never patched from a frame</text><rect x="784" y="350" width="450" height="96" rx="10" fill="#FDFCFA" stroke="#0E7553" stroke-width="1.5"/><rect x="784" y="360" width="3" height="76" rx="1.5" fill="#0E7553"/><text x="1009" y="379" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14130F" text-anchor="middle">UI</text><text x="1009" y="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">ConnectionStrip: reconnecting · connection lost · last updated</text><text x="1009" y="415" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#696459" text-anchor="middle">stale marker on live widgets while disconnected</text><path d="M400 276 L250 350" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M250.0 350.0 L255.5 342.9 L259.0 349.9 Z" fill="#CBC5B8"/><path d="M560 276 L575 350" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M575.0 350.0 L569.6 342.8 L577.2 341.3 Z" fill="#CBC5B8"/><path d="M366 398 L410 398" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M410.0 398.0 L401.9 401.9 L401.9 394.1 Z" fill="#CBC5B8"/><path d="M740 398 L784 398" fill="none" stroke="#CBC5B8" stroke-width="1.6"/><path d="M784.0 398.0 L775.9 401.9 L775.9 394.1 Z" fill="#CBC5B8"/><text x="640" y="490" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#696459" text-anchor="middle">The stream is a projection. Any doubt is resolved by reading the authoritative match over REST.</text></svg>
