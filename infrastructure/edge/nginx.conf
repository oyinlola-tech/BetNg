worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/edge/real-ip.conf;

    # Path without query string: tokens and codes travel in queries.
    log_format edge escape=json '{"time":"$time_iso8601","service":"edge","requestId":"$request_id",'
                                '"host":"$host","remote":"$remote_addr","method":"$request_method","path":"$uri",'
                                '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                                '"upstream":"$upstream_addr","upstreamDuration":"$upstream_response_time",'
                                '"tls":"$ssl_protocol","ua":"$http_user_agent"}';
    access_log /dev/stdout edge;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_max_body_size 256k;
    client_body_buffer_size 64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_next_upstream off;
    proxy_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    include /tmp/conf.d/*.conf;
}
