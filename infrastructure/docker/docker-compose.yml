# BetNG containers.
#
#   (no profile)     PostgreSQL and Redis on loopback, for running services from source
#   platform         every service behind the TLS edge; only the edge publishes ports
#   frontend         the four static browser apps (loopback ports; the edge serves them over TLS)
#   observability    Prometheus, Grafana, Loki and Alloy (Grafana on loopback only)
#   backup           one-shot pg-backup.sh run: `docker compose --profile backup run --rm backup`
#   acme             certbot for Let's Encrypt certificates (docs/operations.md)
#
# Defaults are local development values. Production reads its values from an env file kept outside the
# repository: `docker compose --env-file /etc/betng/platform.env ...` (docs/operations.md).

name: betng

# Static browser apps behind unprivileged nginx: `docker compose --profile frontend up --build`.
# VITE_* build args are baked into the bundle; BETNG_* origins feed the CSP at container start.
x-frontend-build-args: &frontend-build-args
  VITE_APP_ENV: ${FRONTEND_APP_ENV:-production}
  VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:3000}
  VITE_WS_URL: ${FRONTEND_WS_URL:-ws://localhost:3008/live}
  VITE_REALTIME_TRANSPORT: ${FRONTEND_REALTIME_TRANSPORT:-websocket}
  VITE_AUTH_TRANSPORT: ${FRONTEND_AUTH_TRANSPORT:-bearer}
  VITE_UPLOAD_HOSTS: ${FRONTEND_UPLOAD_HOSTS:-}
  VITE_CHECKOUT_HOSTS: ${FRONTEND_CHECKOUT_HOSTS:-}

x-frontend: &frontend
  profiles: ["frontend"]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,uid=101,gid=101,mode=0700,noexec,nosuid,nodev
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  networks: [edge]
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 128M
        pids: 64
  environment:
    BETNG_API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
    BETNG_WS_ORIGIN: ${FRONTEND_WS_ORIGIN:-ws://localhost:3008}
    BETNG_UPLOAD_ORIGINS: ${FRONTEND_UPLOAD_ORIGINS:-}
    BETNG_ANALYTICS_ORIGIN: ${FRONTEND_ANALYTICS_ORIGIN:-}
    BETNG_CHECKOUT_ORIGINS: ${FRONTEND_CHECKOUT_ORIGINS:-}
    BETNG_IMG_ORIGINS: ${FRONTEND_IMG_ORIGINS:-}
    # Local compose talks to the platform over plain http/ws; deployed images leave this false.
    BETNG_ALLOW_INSECURE_ORIGINS: ${FRONTEND_ALLOW_INSECURE_ORIGINS:-true}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  stop_grace_period: 30s
  logging: *logging

x-service-limits: &service-limits
  resources:
    limits:
      cpus: "0.75"
      memory: 384M
      pids: 256

x-node-health: &node-health
  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT}/health || exit 1"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 30s

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ['PORT'], timeout=2)"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 30s

# Shared by every service. Database logins are per service: each container receives only its own.
# Service settings and provider secrets come from $BETNG_ENV_DIR/common.env and <service>.env (outside the repo);
# the values below are wiring and take precedence over those files.
x-platform-env: &platform-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HOST: 0.0.0.0
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in the env file}
  SERVICE_TIMEOUT_MS: ${SERVICE_TIMEOUT_MS:-5000}
  SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-10000}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
  # Built from REDIS_PASSWORD (URL-safe, e.g. hex) unless PLATFORM_REDIS_URL overrides it. Services with NODE_ENV=production
  # refuse a REDIS_URL without a password, so a production stack cannot start against an open Redis.
  REDIS_URL: ${PLATFORM_REDIS_URL:-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379}
  GATEWAY_SERVICE_URL: http://gateway:3000
  MATCH_SERVICE_URL: http://match:3001
  BETTING_SERVICE_URL: http://betting:3002
  WALLET_SERVICE_URL: http://wallet:3003
  SETTLEMENT_SERVICE_URL: http://settlement:3004
  SIMULATION_SERVICE_URL: http://simulation:3005
  ODDS_SERVICE_URL: http://odds:3006
  RISK_SERVICE_URL: http://risk:3007
  EVENT_SERVICE_URL: http://event:3008
  ANALYTICS_SERVICE_URL: http://analytics:3009
  IDENTITY_SERVICE_URL: http://identity:3010
  PAYMENTS_SERVICE_URL: http://payments:3011
  EMAIL_SERVICE_URL: http://email:3012

x-node-build: &node-build
  context: ../..
  dockerfile: infrastructure/docker/node.Dockerfile
  target: runtime

x-python-build: &python-build
  context: ../..
  dockerfile: infrastructure/docker/python.Dockerfile
  target: runtime

x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: betng-postgres
    restart: unless-stopped
    # Nine service pools of 10 plus operations logins exceed the default 100.
    command: ["postgres", "-c", "max_connections=200", "-c", "log_lock_waits=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betng_local_dev}
      # The bootstrap script creates the `betng` database; this is only the
      # database `psql` connects to first.
      POSTGRES_DB: postgres
    ports:
      # Loopback only. 55432, not 5432: a developer machine often runs its own PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory: the `betng` database, one schema
      # and one login per owning service. `pnpm db:bootstrap` applies the same
      # idempotent script to a server that already has data.
      - ../postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    networks: [default, backend]
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    shm_size: 256m
    user: "70:70"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betng} -d betng"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    container_name: betng-redis
    restart: unless-stopped
    # No persistence: everything BetNG puts in Redis is a cache or short-lived
    # match state, rebuildable from the services that own them.
    # An empty REDIS_PASSWORD leaves auth off: local development only. Production sets it in the env file and the
    # platform services' REDIS_URL carries it (x-platform-env).
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    networks: [default, backend]
    read_only: true
    tmpfs:
      - /data:size=16m,uid=999,gid=1000,mode=0700
    user: "999:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 64
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$${REDIS_PASSWORD}\" ] || export REDISCLI_AUTH=\"$${REDIS_PASSWORD}\"; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["platform"]
    <<: *hardened
    restart: "no"
    build:
      <<: *node-build
      target: migrate
    image: betng-migrate
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MATCH_DATABASE_URL: postgresql://betng_match:${MATCH_DB_PASSWORD:-betng_match_local}@postgres:5432/betng?schema=match
      BETTING_DATABASE_URL: postgresql://betng_betting:${BETTING_DB_PASSWORD:-betng_betting_local}@postgres:5432/betng?schema=betting
      WALLET_DATABASE_URL: postgresql://betng_wallet:${WALLET_DB_PASSWORD:-betng_wallet_local}@postgres:5432/betng?schema=wallet
      SETTLEMENT_DATABASE_URL: postgresql://betng_settlement:${SETTLEMENT_DB_PASSWORD:-betng_settlement_local}@postgres:5432/betng?schema=settlement
      IDENTITY_DATABASE_URL: postgresql://betng_identity:${IDENTITY_DB_PASSWORD:-betng_identity_local}@postgres:5432/betng?schema=identity
      EMAIL_DATABASE_URL: postgresql://betng_email:${EMAIL_DB_PASSWORD:-betng_email_local}@postgres:5432/betng?schema=email
      # The first administrator, created once when the identity service first starts.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: gateway, PORT: "3000" }
    image: betng-gateway
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/gateway.env", required: false }
    environment:
      <<: *platform-env
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # The edge overwrites X-Forwarded-For with the client address: exactly one trusted hop.
      GATEWAY_TRUST_PROXY: "1"
    networks: [backend, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck: *node-health
    depends_on:
      <<: *after-migrate
      identity:
        condition: service_healthy

  match:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: match, PORT: "3001" }
    image: betng-match
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/match.env", required: false }
    environment:
      <<: *platform-env
      MATCH_DATABASE_URL: postgresql://betng_match:${MATCH_DB_PASSWORD:-betng_match_local}@postgres:5432/betng?schema=match
    networks: [backend]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  betting:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: betting, PORT: "3002" }
    image: betng-betting
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/betting.env", required: false }
    environment:
      <<: *platform-env
      BETTING_DATABASE_URL: postgresql://betng_betting:${BETTING_DB_PASSWORD:-betng_betting_local}@postgres:5432/betng?schema=betting
    networks: [backend]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  wallet:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: wallet, PORT: "3003" }
    image: betng-wallet
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/wallet.env", required: false }
    environment:
      <<: *platform-env
      WALLET_DATABASE_URL: postgresql://betng_wallet:${WALLET_DB_PASSWORD:-betng_wallet_local}@postgres:5432/betng?schema=wallet
    networks: [backend]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  settlement:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: settlement, PORT: "3004" }
    image: betng-settlement
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/settlement.env", required: false }
    environment:
      <<: *platform-env
      SETTLEMENT_DATABASE_URL: postgresql://betng_settlement:${SETTLEMENT_DB_PASSWORD:-betng_settlement_local}@postgres:5432/betng?schema=settlement
    networks: [backend]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  email:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: email, PORT: "3012" }
    image: betng-email
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/email.env", required: false }
    environment:
      <<: *platform-env
      EMAIL_DATABASE_URL: postgresql://betng_email:${EMAIL_DB_PASSWORD:-betng_email_local}@postgres:5432/betng?schema=email
    networks: [backend]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  event:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: event, PORT: "3008" }
    image: betng-event
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/event.env", required: false }
    environment:
      <<: *platform-env
      EVENT_TRUSTED_PROXY_HOPS: "1"
    # No host port (SEC-15): browsers reach /live through the edge at wss://live.<domain>/live.
    networks: [backend, edge]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  identity:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *node-build
      args: { SERVICE: identity, PORT: "3010" }
    image: betng-identity
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/identity.env", required: false }
    environment:
      <<: *platform-env
      IDENTITY_DATABASE_URL: postgresql://betng_identity:${IDENTITY_DB_PASSWORD:-betng_identity_local}@postgres:5432/betng?schema=identity
    networks: [backend]
    deploy: *service-limits
    healthcheck: *node-health
    depends_on: *after-migrate

  simulation:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *python-build
      args: { SERVICE: simulation, PORT: "3005" }
    image: betng-simulation
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/simulation.env", required: false }
    environment:
      <<: *platform-env
      SIMULATION_DATABASE_URL: postgresql://betng_simulation:${SIMULATION_DB_PASSWORD:-betng_simulation_local}@postgres:5432/betng
      SIMULATION_SEED_SECRET: ${SIMULATION_SEED_SECRET:?set SIMULATION_SEED_SECRET in the env file}
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck: *python-health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  odds:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *python-build
      args: { SERVICE: odds, PORT: "3006" }
    image: betng-odds
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/odds.env", required: false }
    environment:
      <<: *platform-env
      ODDS_DATABASE_URL: postgresql://betng_odds:${ODDS_DB_PASSWORD:-betng_odds_local}@postgres:5432/betng
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck: *python-health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulation:
        condition: service_healthy

  risk:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *python-build
      args: { SERVICE: risk, PORT: "3007" }
    image: betng-risk
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/risk.env", required: false }
    environment:
      <<: *platform-env
      RISK_DATABASE_URL: postgresql://betng_risk:${RISK_DB_PASSWORD:-betng_risk_local}@postgres:5432/betng
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck: *python-health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    profiles: ["platform"]
    <<: *hardened
    build:
      <<: *python-build
      args: { SERVICE: analytics, PORT: "3009" }
    image: betng-analytics
    env_file:
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/common.env", required: false }
      - { path: "${BETNG_ENV_DIR:-/etc/betng/env}/analytics.env", required: false }
    environment:
      <<: *platform-env
      ANALYTICS_DATABASE_URL: postgresql://betng_analytics:${ANALYTICS_DB_PASSWORD:-betng_analytics_local}@postgres:5432/betng
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck: *python-health
    depends_on:
      postgres:
        condition: service_healthy

  # TLS edge (GAP-08): the only published platform ports. Certificates come from EDGE_CERTS_DIR.
  edge:
    profiles: ["platform", "edge"]
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.29.8-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    init: false
    ulimits:
      nofile: { soft: 16384, hard: 16384 }
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700,noexec,nosuid,nodev
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:-betng.localhost}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_ENVSUBST_FILTER: ^EDGE_
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ../edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../edge:/etc/nginx/edge:ro
      - ../edge/templates:/etc/nginx/templates:ro
      - ${EDGE_CERTS_DIR:-/etc/betng/tls}:/etc/nginx/certs:ro
      - edge-acme:/var/www/acme:ro
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:8080"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:8443"
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      gateway:
        condition: service_healthy
        required: false
      event:
        condition: service_healthy
        required: false

  certbot:
    profiles: ["acme"]
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/log/letsencrypt:size=8m,mode=0700
      - /var/lib/letsencrypt:size=8m,mode=0700
    cap_drop: ["ALL"]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    volumes:
      - edge-acme:/var/www/acme
      - ${EDGE_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt
      - ${EDGE_CERTS_DIR:-/etc/betng/tls}:/etc/betng/tls
    networks: [acme]

  backup:
    profiles: ["backup"]
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    user: "70:70"
    entrypoint: ["bash", "/opt/betng/backup/pg-backup.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${BACKUP_PGUSER:-betng_backup}
      PGPASSWORD: ${BACKUP_PGPASSWORD:-betng_backup_local}
      PGAPPNAME: betng-backup
      BACKUP_DATABASE: ${BACKUP_DATABASE:-betng}
      BACKUP_DIR: /backups
      BACKUP_SCHEMAS: ${BACKUP_SCHEMAS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_GLOBALS: ${BACKUP_GLOBALS:-true}
      BACKUP_UPLOAD_HOOK: ${BACKUP_UPLOAD_HOOK:-}
    volumes:
      - ../../scripts/backup:/opt/betng/backup:ro
      - ${BACKUP_HOST_DIR:-/var/backups/betng}:/backups
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 64
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["observability"]
    <<: *hardened
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    init: false
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=:9090
    secrets: [internal_service_token]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks: [backend, observability]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  postgres-exporter:
    profiles: ["observability"]
    <<: *hardened
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    init: false
    user: "65534:65534"
    environment:
      DATA_SOURCE_URI: postgres:5432/betng?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_PGUSER:-betng_monitor}
      DATA_SOURCE_PASS: ${MONITOR_PGPASSWORD:-betng_monitor_local}
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    profiles: ["observability"]
    <<: *hardened
    image: oliver006/redis_exporter:v1.91.1-alpine@sha256:30e56152988ca4bb3784e10debaac8905b78f6a7ff2bbd362a40b8c2a78eb1d6
    init: false
    user: "65534:65534"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 32
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  loki:
    profiles: ["observability"]
    <<: *hardened
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    init: false
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
    # The image has no shell or HTTP client; Prometheus watches it (TargetDown on service="loki").
    healthcheck:
      disable: true

  # Reads Docker's json-file logs from the host, read-only. Root in the container, no capabilities.
  alloy:
    profiles: ["observability"]
    <<: *hardened
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    init: false
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/alloy-data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - alloy-data:/alloy-data
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      loki:
        condition: service_started

  grafana:
    profiles: ["observability"]
    <<: *hardened
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    init: false
    entrypoint: ["sh", "-c", "[ -n \"$${GF_SECURITY_ADMIN_PASSWORD}\" ] || { echo 'set GRAFANA_ADMIN_PASSWORD' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3900/}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PUBLISHED_PORT:-3900}:3000"
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  web:
    <<: *frontend
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        <<: *frontend-build-args
        APP: web
    image: betng-frontend-web
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-8420}:8080"

  tv:
    <<: *frontend
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        <<: *frontend-build-args
        APP: tv
    image: betng-frontend-tv
    ports:
      - "127.0.0.1:${TV_PUBLISHED_PORT:-8430}:8080"

  shop:
    <<: *frontend
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        <<: *frontend-build-args
        APP: shop
    image: betng-frontend-shop
    ports:
      - "127.0.0.1:${SHOP_PUBLISHED_PORT:-8440}:8080"

  admin:
    <<: *frontend
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        <<: *frontend-build-args
        APP: admin
    image: betng-frontend-admin
    ports:
      - "127.0.0.1:${ADMIN_PUBLISHED_PORT:-8450}:8080"

secrets:
  # The same value as INTERNAL_SERVICE_TOKEN, no trailing newline, readable by uid 65534 (docs/operations.md).
  internal_service_token:
    file: ${INTERNAL_SERVICE_TOKEN_FILE:-/etc/betng/secrets/internal_service_token}

networks:
  default: {}
  # Service-to-service traffic, datastores and scraping: no route out of the host.
  backend:
    internal: true
  # Edge to gateway, event and the frontends.
  edge: {}
  observability: {}
  acme: {}

volumes:
  postgres-data:
    name: betng-postgres-data
  edge-acme: {}
  prometheus-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
