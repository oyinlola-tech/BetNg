groups:
  - name: betng
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is not answering /metrics"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} is answering more than 5% server errors"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency is above 1s"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL is above 80% of max_connections"

      - alert: PostgresIdleInTransaction
        expr: sum by (usename) (pg_stat_activity_count{state="idle in transaction"}) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.usename }} holds idle transactions (possible connection leak)"
