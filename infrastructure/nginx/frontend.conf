server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    etag on;

    # Rendered at container start from security-headers.conf.template.
    include /tmp/nginx/security-headers.conf;
    add_header Cache-Control $betng_cache_control always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
