name: Setup workspace
description: Node 24, pnpm from packageManager, cached store, frozen install, optional shared package build.
inputs:
  build-packages:
    description: Build the shared frontend packages after install.
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.build-packages == 'true'
      shell: bash
      run: |
        for name in contracts client-sdk design-tokens brand ui-core; do
          pnpm --filter "@betng/${name}" build
        done
