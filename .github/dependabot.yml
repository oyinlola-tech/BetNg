version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /services/shared
      - /services/simulation
      - /services/odds
      - /services/risk
      - /services/analytics
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # The runtime pins the Python images install under (pip --constraint).
  - package-ecosystem: pip
    directory: /infrastructure/docker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    # pydantic pins pydantic-core to one exact version, so it only ever moves with pydantic.
    ignore:
      - dependency-name: pydantic-core
    groups:
      python-runtime-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    # A PostgreSQL major version changes the data directory format: a planned dump and restore, not a merge.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infrastructure/docker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    # A PostgreSQL major version changes the data directory format: a planned dump and restore, not a merge.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
