name: Dependency audit

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pnpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Reads pnpm-lock.yaml, so no install is needed; dev dependencies are included.
      - run: pnpm audit --audit-level high

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [simulation, odds, risk, analytics]
    env:
      PIP_AUDIT_VERSION: 2.10.1
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Same packages as scripts/python-install.sh, held to the pins the images ship with.
      - name: Install the service
        run: |
          python -m venv "${RUNNER_TEMP}/service"
          "${RUNNER_TEMP}/service/bin/pip" install --quiet --upgrade pip
          "${RUNNER_TEMP}/service/bin/pip" install --quiet \
            --constraint infrastructure/docker/python-constraints.txt \
            -e services/shared \
            -e "services/${SERVICE}[dev]"
          "${RUNNER_TEMP}/service/bin/pip" freeze --exclude-editable > "${RUNNER_TEMP}/installed.txt"
      - name: Install pip-audit
        run: |
          python -m venv "${RUNNER_TEMP}/audit"
          "${RUNNER_TEMP}/audit/bin/pip" install --quiet "pip-audit==${PIP_AUDIT_VERSION}"
      - name: pip-audit
        run: |
          "${RUNNER_TEMP}/audit/bin/pip-audit" --no-deps --disable-pip --progress-spinner off \
            --requirement "${RUNNER_TEMP}/installed.txt"
