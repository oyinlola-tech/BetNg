name: Deploy

# Manual only. Promotes images that Containers published for a main commit to the `production` tag.
# The `production` environment must have required reviewers configured (Settings → Environments).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Commit is on main and passed CI and Containers
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)"
          [[ "${status}" == "ahead" || "${status}" == "identical" ]] || { echo "::error::${SHA} is not on main"; exit 1; }
          for workflow in ci.yml containers.yml; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${SHA}&branch=main&event=push&status=success" --jq .total_count)"
            [[ "${runs}" -gt 0 ]] || { echo "::error::no successful ${workflow} run on main for ${SHA}"; exit 1; }
          done

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix:
        app: [web, tv, shop, admin]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote image
        env:
          SHA: ${{ inputs.sha }}
          APP: ${{ matrix.app }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/frontend-${APP}"
          docker buildx imagetools inspect "${image}:sha-${SHA}" >/dev/null
          docker buildx imagetools create --tag "${image}:production" "${image}:sha-${SHA}"
          echo "Promoted ${image}:sha-${SHA} to production" >> "${GITHUB_STEP_SUMMARY}"
