name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-packages: "true"
      - run: pnpm lint:frontend

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-packages: "true"
      - run: |
          pnpm --filter @betng/ui-web typecheck
          for name in web tv shop admin mobile; do pnpm --filter "@betng/${name}" typecheck; done

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-packages: "true"
      - run: pnpm exec vitest run --project unit packages

  service-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: betng
          POSTGRES_PASSWORD: betng_local_dev
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U betng" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # .env.example holds only local placeholders for a throwaway CI database.
      - run: cp .env.example .env
      - run: |
          bash scripts/db-bootstrap.sh
          bash scripts/db-bootstrap.sh betng_test
      - run: |
          for name in contracts service-kit client-sdk; do pnpm --filter "@betng/${name}" build; done
          pnpm db:generate
      - run: pnpm exec vitest run --project unit apps

  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-packages: "true"
      - run: pnpm exec vitest run --project dom

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-packages: "true"
      - name: Production builds
        run: |
          for name in web tv shop admin; do
            VITE_APP_ENV=production pnpm --filter "@betng/${name}" exec vite build
          done
      - name: Production bundles carry no data-source switch, stand-in or demo credential
        run: |
          if grep -rlE "VITE_DATA_SOURCE|createMock|betng-demo|demo@betng\.test" apps/{web,tv,shop,admin}/dist/assets; then
            echo "::error::A production bundle references development-only data."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: apps/*/dist/
          retention-days: 3
          if-no-files-found: error

  public-env:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: apps
      - run: node scripts/check-public-env.mjs

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: betng
          POSTGRES_PASSWORD: betng_local_dev
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U betng" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-packages: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client redis-tools
      - run: bash scripts/python-install.sh
      - run: |
          pnpm --filter @betng/service-kit build
          pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      # e2e/support/global-setup.ts boots the platform on a fresh seeded database; the Vite dev servers point at its gateway.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            scripts/e2e/.logs/*.log
          retention-days: 7

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: bash scripts/python-install.sh
      - run: bash scripts/python-check.sh
