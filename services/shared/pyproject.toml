[project]
name = "betng-service-kit"
version = "0.1.0"
description = "The shared FastAPI bootstrap for BetNG Python services: configuration, structured logging, request correlation, the error envelope and health probes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "pydantic>=2.10",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.7",
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betng_service_kit"]

[tool.hatch.build.targets.wheel.force-include]
"src/betng_service_kit/py.typed" = "betng_service_kit/py.typed"
