[project]
name = "betng-risk"
version = "0.1.0"
description = "BetNG risk service — exposure, liability, potential payouts, risk limits and worst-case outcome analysis."
requires-python = ">=3.12"
dependencies = [
    "betng-service-kit",
    "fastapi>=0.120",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
betng-risk = "betng_risk.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betng_risk"]

[tool.uv.sources]
betng-service-kit = { path = "../shared", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["betng_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
